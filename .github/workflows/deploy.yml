# 每次 push 到 main 分支，自动构建 Hexo 并发布到 GitHub Pages
# 这个方案不需要 deploy key，用 GitHub 自带的 token 就够了，比教程里的双仓库方案更简单。
name: Deploy Hexo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # 允许在 Actions 页面手动点一下运行

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx hexo clean && npx hexo generate

      - name: Validate generated site
        run: npm run check

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  failure-summary:
    if: ${{ always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure') }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Write failure summary
        run: |
          echo "## Blog deployment failed" >> "$GITHUB_STEP_SUMMARY"
          echo "检查 Build 和 Deploy job 的日志；GitHub 仓库通知设置开启后会收到邮件或站内提醒。" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Hexo blog deployment failed. Check the Build and Deploy job logs."
