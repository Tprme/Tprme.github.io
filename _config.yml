# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Tprme
subtitle: '落子无悔'
description: 'Tprme 的个人博客：记录编程入门路上踩过的坑，主要是 C 语言和 Python 的学习笔记、报错排查与踩坑记录。'
keywords: C语言, Python, 编程入门, 学习笔记, 踩坑记录, 报错排查, Tprme
author: Tprme
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 仓库名必须是 <用户名>.github.io，否则站点会被放到子路径下导致样式 404
url: https://Tprme.github.io
permalink: posts/:year/:month/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - README.md

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js

# LostStar 主题用 highlight.js 客户端高亮，关掉 Hexo 自带的，避免两套样式打架
highlight:
  enable: false
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: false
  line_number: false
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 随笔
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: loststar

# 归档按年份/月份分组会显得很乱，关掉（LostStar 主题建议）
archive_generator:
  enabled: true
  per_page: 0
  yearly: false
  monthly: false
  daily: false

# Deployment
## 本博客用 GitHub Actions 自动部署（见 .github/workflows/deploy.yml），
## 所以这里不配置 hexo-deployer-git，hexo d 不是必需的。
deploy:
  type: ''
