# ===== Tprme 的个人博客 · LostStar 主题配置 =====
# 主题基于 ParticleX / Particle（MIT），作者 thatnghiep-dev

# 头像（注意：不要叫 avatar.jpg，主题自带的同名文件会覆盖 site/source 里的版本）
# 用 WebP：显示尺寸只有 140x140，原来却要下 400x400 的 66 KB JPEG。
# 同尺寸转 WebP 后 44 KB，在设备分辨率下与原图平均色差 2.13/255。
# 没有缩小尺寸：实测降到 320px 时色差会升到 4.91（这张图细节多），不划算。
avatar: /images/me.webp

# 首页背景图（竖版原图，配合 CSS 的 contain 完整显示）
# 同样避免与主题自带的 background.jpg / bg-main.jpg 重名
background:
  - /images/hero.webp

# 加载动画
loading: /images/loading.gif

# ---------- 配色系统 ----------
# 自己的一套冷调极简配色：白底 + 板岩灰字 + 蓝紫点缀
# （主题默认是米白 #fffdfa + 墨绿 #1e3e3f + 金黄导航，这里全部换掉）
taxonomy_styles:
  enable: true

  defaults:
    post:
      bg: "#ffffff"
      text: "#1f2933"
    category:
      bg: "#eef2fb"
      text: "#4a5568"
    tag:
      bg: "#eef2fb"
      text: "#4a5568"
    effects:
      outline:
        enable: false
        color: "#1f293315"
        width: "1px"
      spark:
        enable: false
        color: "#ffffff"
        blur: "8px"
        opacity: 0.35
        duration: "2.6s"

  # 按分类定制配色：每个分类有自己的一张卡片底色
  categories:
    "周报":
      post:
        bg: "#f4f8ff"
        text: "#1f2933"
      category:
        bg: "#dbe7ff"
        text: "#24405f"
      tag_default:
        bg: "#e8efff"
        text: "#24405f"
      effects:
        outline:
          enable: true
          color: "#3b82f633"
          width: "1px"
        spark:
          enable: false
    "Writeup":
      post:
        bg: "#f2fbf7"
        text: "#14342b"
      category:
        bg: "#cdeee0"
        text: "#14432f"
      tag_default:
        bg: "#e0f5ea"
        text: "#14432f"
      effects:
        outline:
          enable: false
        spark:
          enable: false
    "随笔":
      post:
        bg: "#fbf8ff"
        text: "#2a2338"
      category:
        bg: "#e4dbf7"
        text: "#33265c"
      tag_default:
        bg: "#eee8fb"
        text: "#33265c"
      effects:
        outline:
          enable: false
        spark:
          enable: false

  tags:
    "题解":
      bg: "#d8ecff"
      text: "#1c3d5a"

# 主题图标使用 Font Awesome 6
# https://fontawesome.com

# 顶部导航菜单
menu:
  Home:
    name: house
    theme: solid
    link: /
  About:
    name: id-card
    theme: solid
    link: /about
  Archives:
    name: box-archive
    theme: solid
    link: /archives
  Categories:
    name: bookmark
    theme: solid
    link: /categories
  Tags:
    name: tags
    theme: solid
    link: /tags

# 侧边个人资料卡
card:
  enable: true
  description: |
    总有人在背后议论我
    因为我的十九年
    比他们一辈子活的都精彩
  iconLinks:
    GitHub:
      name: github
      theme: brands
      link: https://github.com/Tprme
  # 友链整块去掉。
  # 原来这里是主题自带的示例 `CTF Wiki: https://ctf-wiki.org/`，
  # 但本站内容是 C 语言 / Python 学习笔记，挂一条 CTF 友链对不上。
  # card.ejs 里友链是 `<% if (theme.card.friendLinks) { %>` 包着的，
  # 所以直接不写 friendLinks 这个键，区块（连同它的 border-top）就都不会出现。

# 页脚
footer:
  since: 2026
  copyright:
    name: Tprme
    handle: Tprme
  ICP:
    enable: false
    code:
    link:

# Polyfill（浏览器兼容垫片）
# 已关闭：polyfill.io 服务于 2024 年被转手并发生过供应链投毒事件，
# 且 blog 面向现代浏览器，不需要这一层；关闭同时也去掉一个外部依赖。
polyfill:
  enable: false
  features:
    - default

# 代码高亮
highlight:
  enable: true
  style: github

# 数学公式
math:
  enable: false

# 图片灯箱预览
preview:
  enable: true

# 星空特效（极简风格关掉，这是与参考站的一个明显区分点）
stars:
  enable: false

# 文章加密
crypto:
  enable: false

# 归档页本地搜索
search:
  enable: true

# ---------- 评论系统 ----------
# ★ 评论已按反馈整体移除。
# 四个系统的 enable 现在全是 false，于是文章页不再渲染 #comment 容器、
# 也不再请求任何第三方脚本（giscus 的 client.js / giscus.app 的样式，
# 以及 cdnjs 上 gitalk / waline / twikoo 的资源）。
# 跟着一起删掉的还有：post.ejs 的容器、layout.ejs 的 partial("comment")、
# import.ejs 的资源加载块、glass.js 里同步 giscus 主题的那段、
# custom.css 里的 #comment 样式，以及 layout/comment.ejs 整个文件。
#
# 下面保留 giscus 的配置（含 repoID / categoryID）只是为了将来想开回来时
# 不必再去 giscus.app 重新生成一遍 ID —— 但要注意：
# 光把 enable 改回 true 不够，必须同时恢复上面列出的那几处。
#
# giscus：基于 GitHub Discussions，免费、无需自建服务端。
# 读者用 GitHub 账号登录后即可评论，评论以 Discussion 形式存进仓库。
giscus:
  enable: false
  src: https://giscus.app/client.js
  repo: Tprme/Tprme.github.io
  repoID: R_kgDOUbfxuQ
  category: Announcements
  categoryID: DIC_kwDOUbfxuc4DFqnt
  # pathname：按文章路径匹配讨论，文章改标题不会丢评论
  mapping: pathname
  strict: 0
  reactionsEnabled: 1
  emitMetadata: 0
  inputPosition: bottom
  # 用 light 而不是 preferred_color_scheme：
  # 本站是固定浅色设计，跟随系统偏好会出现「浅色站点里嵌一块深色评论区」的割裂感。
  theme: light
  lang: zh-CN

# Gitalk
gitalk:
  enable: false
  clientID:
  clientSecret:
  repo:
  owner:
  admin:
  language: zh-CN
  proxy:

# Waline
waline:
  enable: false
  serverURL:
  locale:
  commentCount: true
  pageview: false
  emoji:
    - https://unpkg.com/@waline/emojis@1.2.0/weibo
    - https://unpkg.com/@waline/emojis@1.2.0/bilibili
  meta:
    - nick
    - mail
    - link
  requiredMeta:
    - nick
  lang: zh-CN
  wordLimit: 0
  login: enable
  pageSize: 10

# Twikoo
twikoo:
  enable: false
  envID:
  region:
  path: location.pathname
  lang: zh-CN

# ---------- 界面文案（全部改为中文） ----------
